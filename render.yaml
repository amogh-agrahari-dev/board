services:
  - type: web
    name: board-investment-engine
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FAST_MODE
        value: "true"
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: ENABLE_SOCIAL
        value: "false"
      - key: FRONTEND_URL
        value: "https://board-theta-one.vercel.app"
